<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f6f4ee;--card:#fffdf8;--ink:#1d1b26;--mut:#6b6878;--line:#e2ddd0;--brand:#4b3fd1;--brand-ink:#fff;--brand-soft:#ebe8ff;--add:#e3f4e6;--add-ink:#1f6b34;--del:#fbe6e4;--del-ink:#9b2c22;--warn:#8a5a00;--warn-soft:#fff1d1}
@media (prefers-color-scheme:dark){:root{--bg:#14131a;--card:#1c1b24;--ink:#e8e6f0;--mut:#9895a8;--line:#2e2c3a;--brand:#9d93ff;--brand-ink:#14131a;--brand-soft:#26234a;--add:#16301e;--add-ink:#8fd6a2;--del:#3a1a18;--del-ink:#f0a49b;--warn:#f0c46b;--warn-soft:#3a2f12}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}
code,.mono,.code td{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
p code,li code,.why code,.ex code,.opt code{background:var(--brand-soft);color:var(--ink);padding:1px 4px;border-radius:4px}
a{color:var(--brand)}
.page{max-width:1280px;margin:0 auto;padding:32px 16px 96px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px}
header{grid-column:1/-1}header h1{margin:0 0 6px;font-size:28px;letter-spacing:-.01em}
.meta{color:var(--mut);font-size:13px}.meta b{color:var(--ink);font-weight:600}.a{color:var(--add-ink)}.d{color:var(--del-ink)}
.lead{max-width:760px;margin:12px 0 0}
.rail{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto}
.rail a{display:block;padding:6px 10px;border-left:2px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;line-height:1.35}
.rail a small{display:block;color:var(--mut);font-family:ui-monospace,monospace;font-size:11px}
.rail a.cur{border-color:var(--brand);color:var(--brand)}.rail a.quiz-link{margin-top:12px;font-weight:600;color:var(--brand)}
.badge{display:inline-block;font:600 11px/1 ui-monospace,monospace;padding:4px 6px;border-radius:4px;background:var(--brand-soft);color:var(--brand);text-transform:uppercase;vertical-align:2px}
.badge.fix{background:var(--warn-soft);color:var(--warn)}.badge.refactor,.badge.test,.badge.chore,.badge.docs{background:var(--line);color:var(--mut)}
.chip{display:inline-block;font-size:11px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);color:var(--mut);margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:20px}
.card h2{margin:10px 0 2px;font-size:19px}
.why{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:14px 0 6px}.why h4{margin:0 0 2px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.why p{margin:0 0 8px;font-size:14.5px}
details.file{border-top:1px solid var(--line);margin:0 -22px}details.file:last-child{margin-bottom:-20px}
details.file>summary{cursor:pointer;padding:9px 22px;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.file>summary::before{content:"▸";color:var(--mut);width:10px}details.file[open]>summary::before{content:"▾"}
details.file>summary .path{font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all}
.pins{background:var(--brand);color:var(--brand-ink);border-radius:999px;font-size:11px;padding:1px 7px}
.diff{display:grid;grid-template-columns:minmax(0,1fr) 300px;border-top:1px solid var(--line)}
.diff.nonotes{grid-template-columns:minmax(0,1fr)}
.code{overflow-x:auto}.code table{border-collapse:collapse;min-width:100%}
.code td{padding:0 10px;white-space:pre;tab-size:2;line-height:20px;vertical-align:top}
.code td.n{color:var(--mut);text-align:right;user-select:none;width:1%;opacity:.65;padding:0 6px}
.code tr.p-add td{background:var(--add)}.code tr.p-del td{background:var(--del)}
.code tr.hh td{color:var(--brand);background:var(--brand-soft);padding-top:2px;padding-bottom:2px}
.code tr.pinned td{box-shadow:inset 0 1px var(--brand),inset 0 -1px var(--brand)}
.pin{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font:600 11px/18px system-ui;justify-content:center;flex:none}
.code .pin{margin-right:4px;vertical-align:1px;width:16px;height:16px;line-height:16px;font-size:10px}
.notes{position:relative;border-left:1px solid var(--line);background:var(--bg)}
.note{position:absolute;left:10px;right:10px;display:flex;gap:8px;font-size:13px;line-height:1.45;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.code tr.inline-note{display:none}.code tr.inline-note td{white-space:normal;font-family:system-ui;font-size:13px;background:var(--brand-soft);padding:6px 10px}
.skip{padding:10px 22px;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
.quiz{border:2px solid var(--brand);border-radius:14px;background:var(--card);padding:24px}
.quiz h2{margin:0}.q{margin:22px 0;padding-top:18px;border-top:1px solid var(--line)}.q>p{font-weight:600;margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--brand)}.opt input{margin-top:4px;accent-color:var(--brand)}
.opt.ok{background:var(--add);border-color:var(--add-ink)}.opt.bad{background:var(--del);border-color:var(--del-ink)}
.ex{display:none;font-size:14px;border-left:3px solid var(--brand);padding:2px 0 2px 10px;margin-top:8px}.graded .ex{display:block}
.graded .opt{cursor:default}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--brand);color:var(--brand-ink);border:none;border-radius:9px;padding:10px 18px;font:600 14px system-ui;cursor:pointer}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--brand)}
.result{font-weight:600}.result.pass{color:var(--add-ink)}.result.fail{color:var(--del-ink)}
.banner{display:none;margin-top:16px;padding:14px 16px;border-radius:10px;font-weight:600}
.banner.pass{display:block;background:var(--add);color:var(--add-ink)}.banner.fail{display:block;background:var(--del);color:var(--del-ink)}
@media (max-width:980px){.page{grid-template-columns:1fr}.rail{display:none}.diff{grid-template-columns:minmax(0,1fr)}.notes{display:none}.code tr.inline-note{display:table-row}.why{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
<header id="top"></header>
<nav class="rail" id="rail"></nav>
<main id="main"></main>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (tag, attrs = {}, ...kids) => {
	const el = document.createElement(tag);
	for (const [k, v] of Object.entries(attrs)) k === "html" ? (el.innerHTML = v) : k === "text" ? (el.textContent = v) : el.setAttribute(k, v);
	el.append(...kids.filter((k) => k != null));
	return el;
};
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const paras = (s) => s.split(/\n\s*\n/).filter(Boolean).map((p) => `<p>${inline(p.trim())}</p>`).join("");
const sum = (f) => D.commits.reduce((s, c) => s + c.files.reduce((t, x) => t + x[f], 0), 0);

// Header
document.getElementById("top").append(
	$("h1", { text: D.title }),
	$("div", { class: "meta", html: `<b>${esc(D.repo)}</b> · ${esc(D.branch)} · <span class="mono">${esc(D.range)}</span> · ${D.commits.length} commits · <span class="a">+${sum("add")}</span> <span class="d">−${sum("del")}</span> · generated ${esc(D.generated)}` }),
	D.lead ? $("div", { class: "lead", html: paras(D.lead) }) : null,
);

// Rail and commit cards
const rail = document.getElementById("rail"), main = document.getElementById("main");
D.commits.forEach((c, i) => {
	const id = `c-${c.short}`;
	rail.append($("a", { href: `#${id}`, "data-id": id, html: `<small>${c.short}</small>${esc(c.subject.replace(/^\w+(\([^)]*\))?!?:\s*/, ""))}` }));
	const add = c.files.reduce((s, f) => s + f.add, 0), del = c.files.reduce((s, f) => s + f.del, 0);
	const card = $("section", { class: "card", id },
		$("div", { class: "meta", html: `<span class="badge ${esc(c.type)}">${esc(c.type)}</span> ${c.scope ? `<span class="mono">${esc(c.scope)}</span> · ` : ""}<span class="mono">${c.short}</span> · ${esc(c.date)} · ${c.files.length} files <span class="a">+${add}</span> <span class="d">−${del}</span>${c.upstream ? `<span class="chip">cherry-picked from ${c.upstream}</span>` : ""}` }),
		$("h2", { text: c.subject.replace(/^\w+(\([^)]*\))?!?:\s*/, "") }),
		$("div", { class: "why" }, $("div", { html: `<h4>What changed</h4>${paras(c.what)}` }), $("div", { html: `<h4>Why</h4>${paras(c.why)}` })),
	);
	c.files.forEach((f) => card.append(fileBlock(c, f)));
	main.append(card);
});

function fileBlock(c, f) {
	const pins = f.hunks.flatMap((h) => h.lines).filter((l) => l.pin);
	const det = $("details", { class: "file" });
	if (pins.length) det.open = true;
	det.append($("summary", { html: `<span class="path">${esc(f.path)}</span>${f.status !== "modified" ? `<span class="chip">${f.status}</span>` : ""}<span class="mono"><span class="a">+${f.add}</span> <span class="d">−${f.del}</span></span>${pins.length ? `<span class="pins">${pins.length} note${pins.length > 1 ? "s" : ""}</span>` : ""}` }));
	if (f.collapsed) {
		det.append($("div", { class: "skip", text: f.collapsed === "deleted" ? `Deleted file: ${f.del} lines removed. Diff hidden.` : "Generated file. Diff hidden." }));
		return det;
	}
	if (f.status === "binary") return det.append($("div", { class: "skip", text: "Binary file." })), det;
	const tbody = $("tbody");
	for (const h of f.hunks) {
		tbody.append($("tr", { class: "hh" }, $("td", { class: "n" }), $("td", { class: "n" }), $("td", { text: h.header })));
		for (const l of h.lines) {
			const code = $("td");
			if (l.pin) code.append($("span", { class: "pin", text: l.pin }));
			code.append(document.createTextNode(`${l.t === " " ? " " : l.t}${l.s}`));
			const tr = $("tr", { class: (l.t === "+" ? "p-add" : l.t === "-" ? "p-del" : "") + (l.pin ? " pinned" : "") }, $("td", { class: "n", text: l.o ?? "" }), $("td", { class: "n", text: l.n ?? "" }), code);
			if (l.pin) tr.dataset.pin = l.pin;
			tbody.append(tr);
			if (l.pin) tbody.append($("tr", { class: "inline-note" }, $("td", { colspan: 3, html: `<span class="pin">${l.pin}</span> ${inline(l.note)}` })));
		}
	}
	const diff = $("div", { class: `diff${pins.length ? "" : " nonotes"}` }, $("div", { class: "code" }, $("table", {}, tbody)));
	if (pins.length) diff.append($("div", { class: "notes" }, ...pins.map((l) => $("div", { class: "note", "data-pin": l.pin, html: `<span class="pin">${l.pin}</span><span>${inline(l.note)}</span>` }))));
	det.append(diff);
	if (f.truncated) det.append($("div", { class: "skip", html: `Showing the first hunks of ${f.truncated} lines. Full diff: <code>git show ${c.short} -- ${esc(f.path)}</code>` }));
	return det;
}

// Margin notes: place each note level with its line, pushed down when notes would overlap.
function placeNotes() {
	for (const diff of document.querySelectorAll(".diff:not(.nonotes)")) {
		const notes = diff.querySelector(".notes");
		if (!notes.offsetParent) continue;
		let bottom = 0;
		for (const note of notes.children) {
			const row = diff.querySelector(`tr[data-pin="${note.dataset.pin}"]`);
			const top = Math.max(row.offsetTop - 4, bottom + 6);
			note.style.top = `${top}px`;
			bottom = top + note.offsetHeight;
		}
		notes.style.minHeight = `${bottom + 10}px`;
	}
}
addEventListener("resize", placeNotes);
document.addEventListener("toggle", placeNotes, true);

// Quiz
const quiz = $("section", { class: "quiz", id: "quiz" });
main.append(quiz);
rail.append($("a", { href: "#quiz", class: "quiz-link", text: `Quiz · ${D.quiz.length} questions` }));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function renderQuiz() {
	quiz.replaceChildren(
		$("h2", { text: "Quiz" }),
		$("p", { class: "meta", text: `${D.quiz.length} questions. Pass mark ${D.pass}%. Answers and explanations show after you submit. Retry reshuffles.` }),
	);
	shuffle(D.quiz.map((q, i) => ({ ...q, i }))).forEach((q, n) => {
		const box = $("div", { class: "q", "data-i": q.i }, $("p", { html: `${n + 1}. ${inline(q.q)}` }));
		shuffle(q.options.map((o, k) => ({ o, k }))).forEach(({ o, k }) =>
			box.append($("label", { class: "opt", "data-k": k }, $("input", { type: "radio", name: `q${q.i}`, value: k }), $("span", { html: inline(o) }))));
		const see = q.see ? D.commits.find((c) => c.sha.startsWith(q.see.split("#")[0]) || q.see.startsWith(c.short)) : null;
		const pin = q.see?.split("#")[1];
		box.append($("div", { class: "ex", html: inline(q.explain) + (see ? ` <a href="#c-${see.short}">See ${see.short}${pin ? ` · note ${esc(pin)}` : ""}</a>` : "") }));
		quiz.append(box);
	});
	const result = $("span", { class: "result" }), banner = $("div", { class: "banner" });
	const submit = $("button", { class: "btn", text: "Submit" }), retry = $("button", { class: "btn ghost", text: "Retry", style: "display:none" });
	submit.onclick = () => {
		const boxes = [...quiz.querySelectorAll(".q")];
		const missing = boxes.filter((b) => !b.querySelector("input:checked")).length;
		if (missing) return (result.className = "result fail"), (result.textContent = `Answer all questions (${missing} left).`);
		let ok = 0;
		for (const b of boxes) {
			const q = D.quiz[b.dataset.i], picked = Number(b.querySelector("input:checked").value);
			b.classList.add("graded");
			b.querySelectorAll("input").forEach((x) => (x.disabled = true));
			b.querySelector(`.opt[data-k="${q.answer}"]`).classList.add("ok");
			if (picked === q.answer) ok++;
			else b.querySelector(`.opt[data-k="${picked}"]`).classList.add("bad");
		}
		const pct = Math.round((ok / boxes.length) * 100), pass = pct >= D.pass;
		result.className = `result ${pass ? "pass" : "fail"}`;
		result.textContent = `${ok}/${boxes.length} · ${pct}%`;
		banner.className = `banner ${pass ? "pass" : "fail"}`;
		banner.textContent = pass ? `Passed (${pct}% ≥ ${D.pass}%). You may push, merge or open the PR.` : `Not yet (${pct}% < ${D.pass}%). Read the explanations and the linked commits, then retry.`;
		submit.style.display = "none";
		retry.style.display = "";
	};
	retry.onclick = () => { renderQuiz(); quiz.scrollIntoView(); };
	quiz.append($("div", { class: "bar" }, submit, retry, result), banner);
}
renderQuiz();

// Rail highlights the commit in view.
const links = [...rail.querySelectorAll("a[data-id]")];
const io = new IntersectionObserver((entries) => {
	for (const e of entries) if (e.isIntersecting) links.forEach((a) => a.classList.toggle("cur", a.dataset.id === e.target.id));
}, { rootMargin: "-20% 0px -70% 0px" });
document.querySelectorAll("section.card").forEach((s) => io.observe(s));
requestAnimationFrame(placeNotes);
</script>
</body>
</html>
